name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: Compile
        run: mvn -B -ntp -DskipTests compile
      - name: BAUDOT-INTEROP-003 - JAIN SIP re-INVITE correlation gate
        run: bash scripts/run-reinvite-correlation-proof.sh
      - name: BAUDOT-INTEROP-003 - live JAIN SIP re-INVITE overlap gate
        run: bash scripts/run-live-reinvite-overlap.sh
      - name: BAUDOT-INTEROP-003 - live stale-SDP RTT readiness gate
        run: bash scripts/run-live-reinvite-rtt-readiness.sh
      - name: BAUDOT-INTEROP-003 - terminal scenario reduction
        run: python3 -m scripts.validate_ace_reinvite_scenario
      - name: BAUDOT-INTEROP-004 - provider REFER matrix reducer
        run: python3 -m scripts.validate_refer_provider_matrix
      - name: BAUDOT-INTEROP-004 - live JAIN SIP REFER transfer gate
        run: bash scripts/run-live-refer-provider-transfer.sh
      - name: BAUDOT-INTEROP-004 - live replacement RTT handoff gate
        run: bash scripts/run-live-refer-rtt-handoff.sh
      - name: BAUDOT-INTEROP-004 - terminal scenario reduction
        run: python3 -m scripts.validate_ace_refer_scenario
      - name: Scenario 001 - signaling and media
        run: bash scripts/run-local-scenario.sh scenarios/001-signaling-and-media.env
      - name: Scenario 002 - signaling only
        run: bash scripts/run-local-scenario.sh scenarios/002-signaling-only.env
      - name: Scenario 003 - SIP-negotiated RFC 4103 RTT
        run: bash scripts/run-local-rtt-scenario.sh scenarios/003-rtt-rfc4103.env
      - name: Scenario 004 - controlled RFC 2198 recovery
        run: bash scripts/run-local-rtt-scenario.sh scenarios/004-rtt-red-recovery.env
      - name: Preserve evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: baudot-evidence
          path: target/evidence
          if-no-files-found: warn
