name: fineract-consumer-provider-live

on:
  pull_request:
    paths:
      - "docs/fineract-consumer-provider-live.md"
      - "interop/fineract-consumer/**"
      - "scripts/run_fineract_consumer_provider_live.py"
      - ".github/workflows/fineract-consumer-provider-live.yml"
  push:
    branches: [main]
    paths:
      - "docs/fineract-consumer-provider-live.md"
      - "interop/fineract-consumer/**"
      - "scripts/run_fineract_consumer_provider_live.py"
      - ".github/workflows/fineract-consumer-provider-live.yml"

permissions:
  contents: read

jobs:
  live-provider-boundary:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Checkout Baudot
        uses: actions/checkout@v5

      - name: Checkout pinned Apache Fineract Consumer-Facing
        uses: actions/checkout@v5
        with:
          repository: apache/fineract-consumer-facing
          ref: 58eacf7338126aa0de2b2a2ef70319f45d403fbf
          path: .upstream/fineract-consumer-facing
          persist-credentials: false

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Verify Consumer-Facing source pin
        run: test "$(git -C .upstream/fineract-consumer-facing rev-parse HEAD)" = "58eacf7338126aa0de2b2a2ef70319f45d403fbf"

      - name: Exercise authenticated provider read and cross-provider denial
        run: >-
          python scripts/run_fineract_consumer_provider_live.py
          --upstream-root .upstream/fineract-consumer-facing
          --evidence-dir "${RUNNER_TEMP}/fineract-consumer-provider-live"

      - name: Preserve live boundary evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fineract-consumer-provider-live-evidence
          path: ${{ runner.temp }}/fineract-consumer-provider-live
          if-no-files-found: warn
