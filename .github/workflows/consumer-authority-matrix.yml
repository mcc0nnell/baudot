name: consumer-authority-matrix

on:
  pull_request:
    paths:
      - 'interop/authority/**'
      - 'interop/fineract-consumer/provider-access-contract-v1.json'
      - 'interop/fineract-consumer/machine-access-contract-v1.json'
      - 'interop/publication/trs-fund-publication-contract-v1.json'
      - 'interop/fineract/journal-contract-v1.json'
      - 'testkit/fund/governance-boundaries-v1.json'
      - 'scripts/validate_consumer_authority_matrix.py'
      - '.github/workflows/consumer-authority-matrix.yml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'

      - name: Validate consumer authority non-interference
        run: python scripts/validate_consumer_authority_matrix.py
