name: live-fineract-trs-fund

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "docs/live-fineract-trs-fund.md"
      - "docs/live-fineract-settlement-batch.md"
      - "interop/fineract/journal-contract-v1.json"
      - "testkit/part64/fixtures/settlement-batch-v1.json"
      - "scripts/run_live_fineract_trs_fund.py"
      - "scripts/run_live_fineract_settlement_batch.py"
      - "scripts/validate_part64_fund_payment_settlement.py"
      - ".github/workflows/live-fineract-trs-fund.yml"
  push:
    branches:
      - main
    paths:
      - "docs/live-fineract-trs-fund.md"
      - "docs/live-fineract-settlement-batch.md"
      - "interop/fineract/journal-contract-v1.json"
      - "testkit/part64/fixtures/settlement-batch-v1.json"
      - "scripts/run_live_fineract_trs_fund.py"
      - "scripts/run_live_fineract_settlement_batch.py"
      - "scripts/validate_part64_fund_payment_settlement.py"
      - ".github/workflows/live-fineract-trs-fund.yml"

permissions:
  contents: read

env:
  FINERACT_VERSION: "1.15.0"
  FINERACT_COMMIT: "d5636847ac556c30b437254c353f05526d172b97"
  FINERACT_IMAGE: "fineract:baudot-1.15.0"

jobs:
  qualify:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out Baudot
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Syntax-check live harness
        run: python -m py_compile scripts/run_live_fineract_trs_fund.py scripts/run_live_fineract_settlement_batch.py scripts/validate_part64_fund_payment_settlement.py

      - name: Revalidate static payment contract
        run: python scripts/validate_part64_fund_payment_settlement.py

      - name: Check out Apache Fineract 1.15.0
        uses: actions/checkout@v4
        with:
          repository: apache/fineract
          ref: "1.15.0"
          path: target/fineract-1.15.0
          persist-credentials: false
          fetch-depth: 1

      - name: Verify Fineract release lineage
        working-directory: target/fineract-1.15.0
        shell: bash
        run: |
          set -euo pipefail
          observed="$(git rev-parse HEAD)"
          test "$observed" = "$FINERACT_COMMIT"
          printf '{"version":"%s","expectedCommit":"%s","observedCommit":"%s","match":true}\n' \
            "$FINERACT_VERSION" "$FINERACT_COMMIT" "$observed" \
            > ../fineract-source-pin.json

      - name: Prepare Fineract workspace exactly as Apache build-core
        uses: ./target/fineract-1.15.0/.github/actions/setup-and-build-fineract
        with:
          cache-read-only: "false"
          working-directory: target/fineract-1.15.0

      - name: Build exact Fineract image from verified release source
        working-directory: target/fineract-1.15.0
        shell: bash
        run: |
          set -euo pipefail
          ./gradlew --no-daemon --console=plain :fineract-provider:jibDockerBuild \
            -Djib.to.image="$FINERACT_IMAGE" \
            -x test -x cucumber -x buildJavaSdk
          docker tag "$FINERACT_IMAGE" fineract:latest
          docker image inspect "$FINERACT_IMAGE" \
            --format '{"id":"{{.Id}}","repoTags":{{json .RepoTags}}}' \
            > ../fineract-image-build.json
          cid="$(docker create "$FINERACT_IMAGE")"
          docker export "$cid" | tar -tf - | grep 'git.properties' > ../fineract-image-git-properties.txt
          docker rm "$cid"
          test -s ../fineract-image-git-properties.txt

      - name: Start source-built Fineract and PostgreSQL
        working-directory: target/fineract-1.15.0
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/fineract/logs
          docker compose up -d db fineract
          docker compose ps

      - name: Capture live Fineract build info
        shell: bash
        run: |
          set -euo pipefail
          curl -f -k --retry 60 --retry-all-errors --connect-timeout 15 --retry-delay 5 \
            https://localhost:8443/fineract-provider/actuator/health
          curl -f -k --retry 5 --retry-all-errors --connect-timeout 15 --retry-delay 5 \
            https://localhost:8443/fineract-provider/actuator/info \
            -o target/fineract-actuator-info.json
          jq -e '.git | type == "object"' target/fineract-actuator-info.json >/dev/null

      - name: Run live TRS Fund qualification
        env:
          FINERACT_BASE_URL: https://localhost:8443/fineract-provider/api/v1
          FINERACT_USERNAME: mifos
          FINERACT_PASSWORD: password
          FINERACT_TENANT: default
          FINERACT_PINNED_VERSION: ${{ env.FINERACT_VERSION }}
          FINERACT_PINNED_COMMIT: ${{ env.FINERACT_COMMIT }}
          FINERACT_PINNED_IMAGE: ${{ env.FINERACT_IMAGE }}
        run: python scripts/run_live_fineract_trs_fund.py

      - name: Run live TRS settlement batch close
        env:
          FINERACT_BASE_URL: https://localhost:8443/fineract-provider/api/v1
          FINERACT_USERNAME: mifos
          FINERACT_PASSWORD: password
          FINERACT_TENANT: default
          FINERACT_PINNED_VERSION: ${{ env.FINERACT_VERSION }}
          FINERACT_PINNED_COMMIT: ${{ env.FINERACT_COMMIT }}
          FINERACT_PINNED_IMAGE: ${{ env.FINERACT_IMAGE }}
        run: python scripts/run_live_fineract_settlement_batch.py

      - name: Add platform provenance to evidence
        shell: bash
        run: |
          set -euo pipefail
          for out in \
            target/evidence-external/LIVE-FINERACT-TRS/v1 \
            target/evidence-external/LIVE-FINERACT-TRS-BATCH/v1
          do
            cp target/fineract-source-pin.json "$out/source-pin.json"
            cp target/fineract-image-build.json "$out/image-build.json"
            cp target/fineract-image-git-properties.txt "$out/image-git-properties.txt"
            cp target/fineract-actuator-info.json "$out/actuator-info.json"
          done

      - name: Seal live evidence
        shell: bash
        run: |
          set -euo pipefail
          for out in \
            target/evidence-external/LIVE-FINERACT-TRS/v1 \
            target/evidence-external/LIVE-FINERACT-TRS-BATCH/v1
          do
            (
              cd "$out"
              find . -maxdepth 1 -type f ! -name bundle.manifest.sha256 -printf '%f\n' | LC_ALL=C sort \
                | xargs sha256sum > bundle.manifest.sha256
              sha256sum -c bundle.manifest.sha256
            )
          done

      - name: Preserve live single-event evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: baudot-live-fineract-trs-fund
          path: target/evidence-external/LIVE-FINERACT-TRS/v1
          if-no-files-found: warn

      - name: Preserve live settlement-batch evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: baudot-live-fineract-trs-settlement-batch
          path: target/evidence-external/LIVE-FINERACT-TRS-BATCH/v1
          if-no-files-found: warn

      - name: Diagnose Fineract on failure
        if: failure()
        working-directory: target/fineract-1.15.0
        shell: bash
        run: |
          docker compose ps || true
          docker compose logs --tail=200 fineract db || true

      - name: Tear down Fineract
        if: always()
        working-directory: target/fineract-1.15.0
        shell: bash
        run: docker compose down -v --remove-orphans || true
