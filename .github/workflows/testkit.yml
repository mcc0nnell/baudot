name: testkit

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
      - name: Run reference reducer, block, and transport tests
        run: python -m unittest discover -s tests -p "test_*.py"
      - name: Syntax-check external Elixip runner
        run: bash -n scripts/run-elixip-oracle-scenario.sh
      - name: Validate portable testkit contracts and presentation vectors
        run: python -m scripts.validate_testkit
      - name: Validate transport-neutral T140block vectors
        run: python -m scripts.validate_t140block_vectors
      - name: Validate RFC 4103 primary RTP wire vectors
        run: python -m scripts.validate_rfc4103_vectors
      - name: Validate RFC 2198 T.140 redundancy vectors
        run: python -m scripts.validate_rfc2198_vectors
      - name: Validate RFC 4103 deterministic recovery vectors
        run: python -m scripts.validate_rfc4103_recovery_vectors
      - name: Validate RFC 8865 data-channel vectors
        run: python -m scripts.validate_rfc8865_vectors
      - name: Validate versioned cross-transport gateway contracts
        run: python -m scripts.validate_gateway_contracts
      - name: Execute runnable cross-transport gateway contract
        run: python -m scripts.run_gateway_trials
      - name: Validate clean-room iTRS ENUM and SIP discovery vectors
        run: python -m scripts.validate_itrs_resolution_vectors
      - name: Exercise deterministic iTRS fixture matrix
        run: bash scripts/run-itrs-mocks.sh
      - name: Prove iTRS logical route to JAIN-SIP handoff
        run: bash scripts/run-itrs-sip-handoff.sh
      - name: Prove public-evidence iTRS CTE state machine and SIP handoff
        run: bash scripts/run-itrs-cte.sh
      - name: Prove source-anchored ACE Connect Lite vrsverify adapter
        run: bash scripts/run-ace-vrsverify-adapter.sh
