name: testkit

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run reference reducer, block, and transport tests
        run: python -m unittest discover -s tests -p "test_*.py"
      - name: Validate portable testkit contracts and presentation vectors
        run: python scripts/validate_testkit.py
      - name: Validate transport-neutral T140block vectors
        run: python scripts/validate_t140block_vectors.py
      - name: Validate RFC 4103 primary RTP wire vectors
        run: python scripts/validate_rfc4103_vectors.py
