name: part64-vrs-rate-engine

on:
  push:
    paths:
      - "docs/part64-vrs-rate-engine.md"
      - "testkit/part64/vrs-rate-requirements-v1.json"
      - "testkit/part64/fixtures/vrs-rates-2026-27.json"
      - "testkit/part64/fixtures/vrs-rate-cases.json"
      - "testkit/part64/fixtures/vrs-rate-formula-cases.json"
      - "scripts/validate_part64_vrs_rate_engine.py"
      - ".github/workflows/part64-vrs-rate-engine.yml"
  pull_request:
    paths:
      - "docs/part64-vrs-rate-engine.md"
      - "testkit/part64/vrs-rate-requirements-v1.json"
      - "testkit/part64/fixtures/vrs-rates-2026-27.json"
      - "testkit/part64/fixtures/vrs-rate-cases.json"
      - "testkit/part64/fixtures/vrs-rate-formula-cases.json"
      - "scripts/validate_part64_vrs_rate_engine.py"
      - ".github/workflows/part64-vrs-rate-engine.yml"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate Part 64 VRS rate engine
        run: python scripts/validate_part64_vrs_rate_engine.py
