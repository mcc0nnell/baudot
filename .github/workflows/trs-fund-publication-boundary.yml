name: trs-fund-publication-boundary

on:
  pull_request:
    paths:
      - "docs/trs-fund-publication-boundary.md"
      - "interop/publication/trs-fund-publication-contract-v1.json"
      - "testkit/fund/rolka-loube-2025-26.json"
      - "scripts/build_trs_fund_public_projection.py"
      - "site/public/data/trs-fund-public-2025-26.json"
      - ".github/workflows/trs-fund-publication-boundary.yml"
  push:
    branches: [main]
    paths:
      - "docs/trs-fund-publication-boundary.md"
      - "interop/publication/trs-fund-publication-contract-v1.json"
      - "testkit/fund/rolka-loube-2025-26.json"
      - "scripts/build_trs_fund_public_projection.py"
      - "site/public/data/trs-fund-public-2025-26.json"
      - ".github/workflows/trs-fund-publication-boundary.yml"

permissions:
  contents: read

jobs:
  publication-boundary:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Validate deterministic public projection
        run: python scripts/build_trs_fund_public_projection.py
