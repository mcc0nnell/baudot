name: superset-pinot-live-admission

on:
  workflow_dispatch:
    inputs:
      rows:
        description: 'Synthetic privacy-reduced CDR rows'
        required: true
        default: '1000'

permissions:
  contents: read

jobs:
  live-admission:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'

      - name: Validate contracts and generate corpus
        env:
          ROWS: ${{ inputs.rows }}
        run: |
          python scripts/validate_olap_live_harness.py
          python scripts/validate_superset_pinot_cdr.py
          python scripts/generate_olap_live_corpus.py --rows "$ROWS"
          mkdir -p target/superset-pinot

      - name: Start pinned Kafka 4.3.1
        run: |
          docker network create baudot-superset-pinot
          docker pull apache/kafka:4.3.1
          docker run -d \
            --name kafka \
            --hostname kafka \
            --network baudot-superset-pinot \
            -e KAFKA_NODE_ID=1 \
            -e KAFKA_PROCESS_ROLES=broker,controller \
            -e KAFKA_LISTENERS=PLAINTEXT://:9092,CONTROLLER://:9093 \
            -e KAFKA_ADVERTISED_LISTENERS=PLAINTEXT://kafka:9092 \
            -e KAFKA_CONTROLLER_LISTENER_NAMES=CONTROLLER \
            -e KAFKA_LISTENER_SECURITY_PROTOCOL_MAP=CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT \
            -e KAFKA_INTER_BROKER_LISTENER_NAME=PLAINTEXT \
            -e KAFKA_CONTROLLER_QUORUM_VOTERS=1@kafka:9093 \
            -e KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR=1 \
            -e KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR=1 \
            -e KAFKA_TRANSACTION_STATE_LOG_MIN_ISR=1 \
            -e KAFKA_AUTO_CREATE_TOPICS_ENABLE=false \
            apache/kafka:4.3.1

          ready=0
          for attempt in $(seq 1 90); do
            if docker exec kafka /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --list >/dev/null 2>&1; then
              ready=1
              break
            fi
            sleep 1
          done
          if [ "$ready" -ne 1 ]; then
            docker logs kafka
            exit 1
          fi

          docker exec kafka /opt/kafka/bin/kafka-topics.sh \
            --bootstrap-server kafka:9092 \
            --create \
            --topic baudot.olap.cdr.v1 \
            --partitions 1 \
            --replication-factor 1

          cat target/olap-live/cdr_analytics_v1.jsonl | \
            docker exec -i kafka /opt/kafka/bin/kafka-console-producer.sh \
              --bootstrap-server kafka:9092 \
              --topic baudot.olap.cdr.v1

      - name: Start pinned Pinot 1.5.1 and ingest corpus
        env:
          ROWS: ${{ inputs.rows }}
        run: |
          docker pull apachepinot/pinot:1.5.1
          docker run -d --name pinot-zk --hostname pinot-zk --network baudot-superset-pinot \
            apachepinot/pinot:1.5.1 StartZookeeper -zkPort 2181
          sleep 4
          docker run -d --name pinot-controller --hostname pinot-controller --network baudot-superset-pinot -p 9000:9000 \
            apachepinot/pinot:1.5.1 StartController -zkAddress pinot-zk:2181
          docker run -d --name pinot-broker --hostname pinot-broker --network baudot-superset-pinot -p 8099:8099 \
            apachepinot/pinot:1.5.1 StartBroker -zkAddress pinot-zk:2181
          docker run -d --name pinot-server --hostname pinot-server --network baudot-superset-pinot -p 8098:8098 \
            apachepinot/pinot:1.5.1 StartServer -zkAddress pinot-zk:2181

          ready=0
          for attempt in $(seq 1 120); do
            if curl -fsS http://localhost:9000/schemas >/dev/null 2>&1; then
              ready=1
              break
            fi
            sleep 2
          done
          if [ "$ready" -ne 1 ]; then
            docker logs pinot-controller
            exit 1
          fi

          curl -fsS -X POST -H 'Content-Type: application/json' \
            --data-binary @interop/olap/pinot/cdr_analytics_v1.schema.json \
            http://localhost:9000/schemas \
            > target/superset-pinot/pinot-schema-response.json
          curl -fsS -X POST -H 'Content-Type: application/json' \
            --data-binary @interop/olap/pinot/cdr_analytics_v1.realtime.table.json \
            http://localhost:9000/tables \
            > target/superset-pinot/pinot-table-response.json

          python scripts/run_olap_live_benchmark.py wait \
            --engine pinot \
            --endpoint http://localhost:8099 \
            --expected "$ROWS" \
            --timeout 360 \
            --out target/superset-pinot/pinot-wait.json

      - name: Build pinned Superset 6.1.0 plus pinotdb 9.1.2
        run: |
          docker build \
            -f interop/superset/pinot/Dockerfile \
            -t baudot-superset-pinot:6.1.0 .
          docker image inspect baudot-superset-pinot:6.1.0 --format '{{.Id}}' \
            > target/superset-pinot/superset-image-id.txt

      - name: Start synthetic Superset and initialize admin
        run: |
          cat > target/superset-pinot/superset_config.py <<'PY'
          SECRET_KEY = "baudot-synthetic-superset-pinot-admission-key-only"
          SQLALCHEMY_DATABASE_URI = "sqlite:////app/superset_home/superset.db"
          WTF_CSRF_ENABLED = True
          PY

          docker run -d \
            --name superset \
            --hostname superset \
            --network baudot-superset-pinot \
            -p 8088:8088 \
            -v "$PWD/target/superset-pinot/superset_config.py:/app/superset_config.py:ro" \
            -e SUPERSET_CONFIG_PATH=/app/superset_config.py \
            baudot-superset-pinot:6.1.0 \
            /bin/bash -lc 'superset db upgrade && superset fab create-admin --username admin --firstname Baudot --lastname Synthetic --email admin@example.invalid --password admin && superset init && exec /usr/bin/run-server.sh'

          ready=0
          for attempt in $(seq 1 150); do
            if curl -fsS http://localhost:8088/health | grep -qx OK; then
              ready=1
              break
            fi
            sleep 2
          done
          if [ "$ready" -ne 1 ]; then
            docker logs superset
            exit 1
          fi

          docker exec superset /app/.venv/bin/python -c \
            'import importlib.metadata; print(importlib.metadata.version("pinotdb"))' \
            > target/superset-pinot/pinotdb-version.txt
          test "$(cat target/superset-pinot/pinotdb-version.txt)" = "9.1.2"

      - name: Admit Pinot through Superset REST API
        run: |
          python scripts/run_superset_pinot_admission.py \
            --base-url http://localhost:8088 \
            --username admin \
            --password admin \
            --out target/superset-pinot/admission.json

      - name: Seal admission evidence
        run: |
          docker image inspect apachepinot/pinot:1.5.1 --format '{{.Id}}' \
            > target/superset-pinot/pinot-image-id.txt
          docker image inspect apache/kafka:4.3.1 --format '{{.Id}}' \
            > target/superset-pinot/kafka-image-id.txt
          cp target/olap-live/corpus-metadata.json target/superset-pinot/corpus-metadata.json
          sha256sum target/superset-pinot/* > target/superset-pinot/SHA256SUMS.txt

      - name: Preserve admission evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: superset-pinot-live-admission-evidence
          path: target/superset-pinot/
          if-no-files-found: warn

      - name: Clean up live stack
        if: always()
        run: |
          docker rm -f superset pinot-controller pinot-broker pinot-server pinot-zk kafka >/dev/null 2>&1 || true
          docker network rm baudot-superset-pinot >/dev/null 2>&1 || true
