name: part64-vrs-compensability

on:
  push:
    paths:
      - "docs/part64-vrs-compensability.md"
      - "testkit/part64/vrs-compensability-requirements-v1.json"
      - "testkit/part64/fixtures/vrs-compensability-cases.json"
      - "testkit/part64/fixtures/vrs-compensation-certification.json"
      - "scripts/validate_part64_vrs_compensability.py"
      - ".github/workflows/part64-vrs-compensability.yml"
  pull_request:
    paths:
      - "docs/part64-vrs-compensability.md"
      - "testkit/part64/vrs-compensability-requirements-v1.json"
      - "testkit/part64/fixtures/vrs-compensability-cases.json"
      - "testkit/part64/fixtures/vrs-compensation-certification.json"
      - "scripts/validate_part64_vrs_compensability.py"
      - ".github/workflows/part64-vrs-compensability.yml"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate Part 64 VRS compensability contract
        run: python scripts/validate_part64_vrs_compensability.py
