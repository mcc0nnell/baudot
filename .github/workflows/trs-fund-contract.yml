name: trs-fund-contract

on:
  pull_request:
    paths:
      - "docs/trs-fund-fineract-proving-ground.md"
      - "testkit/fund/**"
      - "scripts/validate_trs_fund_contract.py"
      - ".github/workflows/trs-fund-contract.yml"
  push:
    branches:
      - main
    paths:
      - "docs/trs-fund-fineract-proving-ground.md"
      - "testkit/fund/**"
      - "scripts/validate_trs_fund_contract.py"
      - ".github/workflows/trs-fund-contract.yml"

permissions:
  contents: read

jobs:
  validate-fund-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Syntax-check fund validator
        run: python -m py_compile scripts/validate_trs_fund_contract.py

      - name: Validate synthetic accounting and authority invariants
        run: python scripts/validate_trs_fund_contract.py

      - name: Seal static contract evidence
        shell: bash
        run: |
          set -euo pipefail
          out=target/evidence-external/TRS-FUND-CONTRACT/static
          mkdir -p "$out"
          cp testkit/fund/trs-fund-contract-v1.json "$out/"
          cp scripts/validate_trs_fund_contract.py "$out/"
          (
            cd "$out"
            sha256sum trs-fund-contract-v1.json validate_trs_fund_contract.py > bundle.manifest.sha256
            sha256sum -c bundle.manifest.sha256
          )

      - name: Preserve fund-contract evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: baudot-trs-fund-contract
          path: target/evidence-external/TRS-FUND-CONTRACT/static
          if-no-files-found: warn
