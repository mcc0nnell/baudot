name: linphone-candidate-admission

on:
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/linphone-candidate-admission.yml'
      - 'interop/linphone/**'
      - 'scripts/linphone_candidate_admission.py'
      - 'docs/adr/0003-linphone-native-rtt-candidate.md'
      - 'README.md'

permissions:
  contents: read

concurrency:
  group: linphone-candidate-admission-${{ github.ref }}
  cancel-in-progress: true

jobs:
  source-admission:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Fetch exact Linphone SDK candidate
        shell: bash
        run: |
          set -euo pipefail
          git clone --filter=blob:none --no-checkout \
            https://github.com/BelledonneCommunications/linphone-sdk.git \
            /tmp/baudot-linphone-sdk
          git -C /tmp/baudot-linphone-sdk checkout --detach \
            10f0cb98eb5ae7dae973d6666894561ce5eea561
          test "$(git -C /tmp/baudot-linphone-sdk rev-parse HEAD)" = \
            10f0cb98eb5ae7dae973d6666894561ce5eea561
          test -z "$(git -C /tmp/baudot-linphone-sdk status --porcelain=v1 --untracked-files=normal)"

      - name: Validate admission script syntax
        shell: bash
        run: python3 -m py_compile scripts/linphone_candidate_admission.py

      - name: Run source-admission gate
        shell: bash
        env:
          LINPHONE_SDK_ROOT: /tmp/baudot-linphone-sdk
        run: python3 scripts/linphone_candidate_admission.py

      - name: Validate candidate driver source boundary
        shell: bash
        run: |
          set -euo pipefail
          driver=interop/linphone/native_t140_sender.c
          grep -q 'linphone_factory_create_core_3' "$driver"
          grep -q 'linphone_core_start' "$driver"
          grep -q 'linphone_call_params_enable_realtime_text' "$driver"
          grep -q 'linphone_chat_room_create_message_from_utf8' "$driver"
          grep -q 'linphone_chat_message_put_char' "$driver"
          ! grep -Eq 'linphone_core_new\(|linphone_chat_room_create_message\(' "$driver"
          ! grep -Eq 'pjmedia_txt_stream_send_text|MS_RTT_4103_SOURCE|RtpSession|rtp_session_send|sendto\(|socket\(' \
            "$driver"
          sha256sum "$driver" \
            > target/evidence-external/LINPHONE-CANDIDATE/source-admission/baudot-driver.sha256

      - name: Seal source-admission evidence
        shell: bash
        run: |
          set -euo pipefail
          out=target/evidence-external/LINPHONE-CANDIDATE/source-admission
          test -f "$out/linphone-source-admission.json"
          test -f "$out/baudot-driver.sha256"
          (
            cd "$out"
            sha256sum linphone-source-admission.json baudot-driver.sha256 \
              > bundle.manifest.sha256
            sha256sum -c bundle.manifest.sha256
          )

      - name: Preserve Linphone candidate source-admission evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: baudot-linphone-candidate-source-admission
          path: target/evidence-external/LINPHONE-CANDIDATE/source-admission
          if-no-files-found: warn
