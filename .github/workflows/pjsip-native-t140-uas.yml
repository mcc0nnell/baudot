name: pjsip-native-t140-uas

on:
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/pjsip-native-t140-uas.yml'
      - 'interop/pjsip/CMakeLists.txt'
      - 'interop/pjsip/native_t140_uas.cpp'
      - 'scripts/live_t140_readiness_gate.py'
      - 'scripts/run-pjsip-native-t140-uas.sh'
      - 'scripts/validate_pjsip_native_t140_uas.py'
      - 'src/main/java/org/mcc0nnell/baudot/harness/PjsipNativeTextUasProbe.java'
      - 'pom.xml'

permissions:
  contents: read

concurrency:
  group: pjsip-native-t140-uas-${{ github.ref }}
  cancel-in-progress: true

jobs:
  incoming-native-text-evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Install native build prerequisites
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            cmake \
            libasound2-dev \
            libssl-dev \
            pkg-config \
            iproute2

      - name: Fetch exact PJSIP 2.17 native-media oracle
        shell: bash
        run: |
          set -euo pipefail
          git clone https://github.com/pjsip/pjproject.git /tmp/baudot-pjproject
          git -C /tmp/baudot-pjproject checkout --detach 5a457451fa2712ba18e12b01738e8ff3af2b26fd
          test "$(git -C /tmp/baudot-pjproject rev-parse HEAD)" = 5a457451fa2712ba18e12b01738e8ff3af2b26fd
          test "$(git -C /tmp/baudot-pjproject describe --tags --exact-match HEAD)" = 2.17
          test -z "$(git -C /tmp/baudot-pjproject status --porcelain=v1 --untracked-files=normal)"

      - name: Validate runner syntax
        shell: bash
        run: bash -n scripts/run-pjsip-native-t140-uas.sh

      - name: Execute incoming PJSIP native T.140 experiment
        shell: bash
        env:
          PJSIP_ROOT: /tmp/baudot-pjproject
        run: bash scripts/run-pjsip-native-t140-uas.sh

      - name: Verify outer evidence manifest
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          manifest=target/evidence-external/PJSIP-NATIVE-T140-UAS/pjsip-2.17-native-text-uas-v1/bundle.manifest.sha256
          test -f "$manifest"
          (cd "$(dirname "$manifest")" && sha256sum -c bundle.manifest.sha256)

      - name: Preserve incoming PJSIP native T.140 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: baudot-pjsip-2.17-native-t140-uas
          path: target/evidence-external/PJSIP-NATIVE-T140-UAS/pjsip-2.17-native-text-uas-v1
          if-no-files-found: warn
