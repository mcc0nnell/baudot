name: nifi-tika-solr-handoff

on:
  pull_request:
    paths:
      - 'testkit/business/nifi-tika-solr-handoff-v1.json'
      - 'testkit/documents/live/**'
      - 'interop/solr/security/**'
      - 'scripts/run_nifi_live.py'
      - 'scripts/run_tika_solr_live.py'
      - 'scripts/validate_nifi_tika_solr_handoff.py'
      - 'scripts/validate_nifi_tika_solr_handoff_negative.py'
      - 'scripts/run_nifi_tika_solr_handoff.py'
      - 'docs/nifi-tika-solr-handoff.md'
      - '.github/workflows/nifi-tika-solr-handoff.yml'
  push:
    paths:
      - 'testkit/business/nifi-tika-solr-handoff-v1.json'
      - 'testkit/documents/live/**'
      - 'interop/solr/security/**'
      - 'scripts/run_nifi_live.py'
      - 'scripts/run_tika_solr_live.py'
      - 'scripts/validate_nifi_tika_solr_handoff.py'
      - 'scripts/validate_nifi_tika_solr_handoff_negative.py'
      - 'scripts/run_nifi_tika_solr_handoff.py'
      - 'docs/nifi-tika-solr-handoff.md'
      - '.github/workflows/nifi-tika-solr-handoff.yml'

permissions:
  contents: read

env:
  NIFI_VERSION: '2.11.0'
  TIKA_VERSION: '4.0.0'
  SOLR_VERSION: '10.0.0'
  NIFI_USER: 'baudotadmin'
  NIFI_PASSWORD: 'synthetic-nifi-test-only'
  SOLR_USER: 'solr'
  SOLR_PASSWORD: 'SolrRocks'

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Validate converged append-only handoff contract
        run: |
          set -euo pipefail
          python -m py_compile \
            scripts/run_nifi_live.py \
            scripts/run_tika_solr_live.py \
            scripts/validate_nifi_tika_solr_handoff.py \
            scripts/validate_nifi_tika_solr_handoff_negative.py \
            scripts/run_nifi_tika_solr_handoff.py
          python scripts/validate_nifi_tika_solr_handoff.py
          python scripts/validate_nifi_tika_solr_handoff_negative.py

  live-handoff:
    runs-on: ubuntu-24.04
    needs: validate
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'

      - name: Verify converged live handoff inputs
        run: |
          set -euo pipefail
          test -f scripts/run_nifi_live.py
          test -f scripts/run_tika_solr_live.py
          test -f testkit/documents/live/public-rule.txt
          test -f interop/solr/security/basic-auth-security.json
          python -m py_compile \
            scripts/run_nifi_live.py \
            scripts/run_tika_solr_live.py \
            scripts/run_nifi_tika_solr_handoff.py

      - name: Start pinned NiFi 2.11.0
        run: |
          set -euo pipefail
          mkdir -p target/nifi-tika-solr-handoff/nifi
          chmod 777 target/nifi-tika-solr-handoff/nifi
          docker pull "apache/nifi:${NIFI_VERSION}"
          docker run -d --name baudot-nifi \
            -p 127.0.0.1:8443:8443 \
            -e SINGLE_USER_CREDENTIALS_USERNAME="$NIFI_USER" \
            -e SINGLE_USER_CREDENTIALS_PASSWORD="$NIFI_PASSWORD" \
            -e NIFI_WEB_PROXY_HOST='127.0.0.1:8443' \
            -v "$PWD/target/nifi-tika-solr-handoff/nifi:/data" \
            "apache/nifi:${NIFI_VERSION}"
          ready=0
          for attempt in $(seq 1 90); do
            if curl -kfsS https://127.0.0.1:8443/nifi-api/authentication/configuration >/dev/null; then
              ready=1
              break
            fi
            sleep 2
          done
          if [ "$ready" -ne 1 ]; then
            docker logs baudot-nifi
            exit 1
          fi
          docker inspect --format='{{.Image}}' baudot-nifi > target/nifi-tika-solr-handoff/nifi-image-id.txt

      - name: Start pinned Tika 4.0.0
        run: |
          set -euo pipefail
          docker pull "apache/tika:${TIKA_VERSION}"
          docker run -d --name baudot-tika \
            -p 127.0.0.1:9998:9998 \
            "apache/tika:${TIKA_VERSION}"
          ready=0
          for attempt in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:9998/version > target/nifi-tika-solr-handoff/tika-version.txt; then
              ready=1
              break
            fi
            sleep 1
          done
          if [ "$ready" -ne 1 ]; then
            docker logs baudot-tika
            exit 1
          fi
          docker inspect --format='{{.Image}}' baudot-tika > target/nifi-tika-solr-handoff/tika-image-id.txt

      - name: Bootstrap pinned Solr 10.0.0 and fail-closed auth
        run: |
          set -euo pipefail
          docker pull "solr:${SOLR_VERSION}"
          docker volume create baudot-solr-data
          docker run --rm --user root \
            -v baudot-solr-data:/var/solr \
            "solr:${SOLR_VERSION}" bash -c \
            'mkdir -p /var/solr/data && chown -R solr:solr /var/solr'
          docker run -d --name baudot-solr-bootstrap \
            -p 127.0.0.1:8983:8983 \
            -v baudot-solr-data:/var/solr \
            "solr:${SOLR_VERSION}" solr-precreate baudot_docs
          ready=0
          for attempt in $(seq 1 90); do
            if curl -fsS 'http://127.0.0.1:8983/solr/baudot_docs/select?q=*:*&wt=json' >/dev/null; then
              ready=1
              break
            fi
            sleep 1
          done
          if [ "$ready" -ne 1 ]; then
            docker logs baudot-solr-bootstrap
            exit 1
          fi
          docker stop baudot-solr-bootstrap
          docker rm baudot-solr-bootstrap
          docker run --rm --user root \
            -v baudot-solr-data:/var/solr \
            -v "$PWD/interop/solr/security/basic-auth-security.json:/tmp/security.json:ro" \
            "solr:${SOLR_VERSION}" bash -c \
            'cp /tmp/security.json /var/solr/data/security.json && chown solr:solr /var/solr/data/security.json && chmod 640 /var/solr/data/security.json'
          docker run -d --name baudot-solr \
            -p 127.0.0.1:8983:8983 \
            -v baudot-solr-data:/var/solr \
            "solr:${SOLR_VERSION}" solr-fg --user-managed
          ready=0
          for attempt in $(seq 1 90); do
            if curl -fsS -u "$SOLR_USER:$SOLR_PASSWORD" \
              'http://127.0.0.1:8983/solr/baudot_docs/select?q=*:*&wt=json' >/dev/null; then
              ready=1
              break
            fi
            sleep 1
          done
          if [ "$ready" -ne 1 ]; then
            docker logs baudot-solr
            exit 1
          fi
          docker inspect --format='{{.Image}}' baudot-solr > target/nifi-tika-solr-handoff/solr-image-id.txt

      - name: Exercise provenance-preserving replay-safe handoff
        run: |
          set -euo pipefail
          umask 000
          python scripts/run_nifi_tika_solr_handoff.py \
            --nifi https://127.0.0.1:8443 \
            --nifi-user "$NIFI_USER" \
            --nifi-password "$NIFI_PASSWORD" \
            --tika http://127.0.0.1:9998 \
            --solr http://127.0.0.1:8983 \
            --solr-user "$SOLR_USER" \
            --solr-password "$SOLR_PASSWORD" \
            --data-root target/nifi-tika-solr-handoff/nifi \
            --out target/nifi-tika-solr-handoff/evidence.json

      - name: Verify closure evidence
        run: |
          set -euo pipefail
          evidence=target/nifi-tika-solr-handoff/evidence.json
          jq -e '.upstreamEnvelopeUnchanged == true' "$evidence" >/dev/null
          jq -e '.rawBytesPreserved == true' "$evidence" >/dev/null
          jq -e '.contentHashMatched == true' "$evidence" >/dev/null
          jq -e '.indexRoundTripPreservedUpstream == true' "$evidence" >/dev/null
          jq -e '.derived.derivedEvidenceOnly == true' "$evidence" >/dev/null
          jq -e '.replay.exactReplayIdempotent == true' "$evidence" >/dev/null
          jq -e '.replay.exactReplayRecordCount == 1' "$evidence" >/dev/null
          jq -e '.replay.sameSourceDifferentEnvelopeRejected == true' "$evidence" >/dev/null
          jq -e '.replay.observationLedgerClaimed == false' "$evidence" >/dev/null
          jq -e '.authority | [ .[] ] | all(. == false)' "$evidence" >/dev/null
          jq -e '.upstream | keys | sort == ["contentSha256","correlationId","flowId","receivedAt","sourceObjectId","sourceSystem"]' "$evidence" >/dev/null
          ! grep -Eq '"(documentId|sourceSha256)"' "$evidence"

      - name: Capture service logs
        if: always()
        run: |
          docker logs baudot-nifi > target/nifi-tika-solr-handoff/nifi-container.log 2>&1 || true
          docker logs baudot-tika > target/nifi-tika-solr-handoff/tika-container.log 2>&1 || true
          docker logs baudot-solr > target/nifi-tika-solr-handoff/solr-container.log 2>&1 || true

      - name: Preserve bounded handoff evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nifi-tika-solr-handoff-evidence
          path: target/nifi-tika-solr-handoff/
          if-no-files-found: warn

      - name: Stop live services
        if: always()
        run: |
          docker rm -f baudot-nifi baudot-tika baudot-solr-bootstrap baudot-solr >/dev/null 2>&1 || true
          docker volume rm baudot-solr-data >/dev/null 2>&1 || true
