name: causal-proof-contract

on:
  pull_request:
    paths:
      - "docs/causal-proof-model.md"
      - "testkit/meta/causal-proof-contract-v1.json"
      - "scripts/validate_causal_proof_contract.py"
      - "scripts/validate_causal_proof_manifest.py"
      - "scripts/validate_refer_rtt_handoff.py"
      - "scripts/run-live-refer-rtt-handoff.sh"
      - ".github/workflows/causal-proof-contract.yml"
  push:
    branches:
      - main
    paths:
      - "docs/causal-proof-model.md"
      - "testkit/meta/causal-proof-contract-v1.json"
      - "scripts/validate_causal_proof_contract.py"
      - "scripts/validate_causal_proof_manifest.py"
      - "scripts/validate_refer_rtt_handoff.py"
      - "scripts/run-live-refer-rtt-handoff.sh"
      - ".github/workflows/causal-proof-contract.yml"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Validate causal proof contract
        run: python scripts/validate_causal_proof_contract.py
      - name: Self-test portable causal proof verifier
        run: python scripts/validate_causal_proof_manifest.py --self-test
