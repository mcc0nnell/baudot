name: trs-fund-public-model

on:
  pull_request:
    paths:
      - "docs/trs-fund-public-ledger.md"
      - "docs/adr/0003-synthetic-fund-event-runtime.md"
      - "testkit/fund/**"
      - "interop/fineract/**"
      - "scripts/validate_trs_fund_public_model.py"
      - "scripts/run_fineract_fund_scenario.py"
      - ".github/workflows/trs-fund-public-model.yml"
  push:
    branches: [main]
    paths:
      - "docs/trs-fund-public-ledger.md"
      - "docs/adr/0003-synthetic-fund-event-runtime.md"
      - "testkit/fund/**"
      - "interop/fineract/**"
      - "scripts/validate_trs_fund_public_model.py"
      - "scripts/run_fineract_fund_scenario.py"
      - ".github/workflows/trs-fund-public-model.yml"

permissions:
  contents: read

jobs:
  public-model:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Validate public TRS Fund calibration
        run: python scripts/validate_trs_fund_public_model.py
      - name: Test synthetic Fund event runtime
        run: python -m unittest discover -s testkit/fund/runtime -p "test_*.py" -v
      - name: Test Fineract executor and independent reconciliation
        run: python -m unittest discover -s interop/fineract -p "test_*.py" -v
      - name: Validate five-year Fineract execution plan
        run: python scripts/run_fineract_fund_scenario.py --plan-only
