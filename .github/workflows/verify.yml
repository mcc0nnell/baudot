name: verify

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  maven:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        java: ['17', '21']

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
          cache: maven

      - name: Verify
        run: mvn -B -ntp verify

      - name: Preserve SIP evidence
        if: matrix.java == '21' && always()
        uses: actions/upload-artifact@v4
        with:
          name: baudot-sip-evidence-java21
          path: target/baudot-evidence/
          if-no-files-found: warn
