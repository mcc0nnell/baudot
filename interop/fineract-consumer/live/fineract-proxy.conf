server {
    listen 8080;
    server_name _;

    access_log /var/log/nginx/access.log combined;

    location = /healthz {
        access_log off;
        add_header Content-Type text/plain;
        return 200 'ok\n';
    }

    location / {
        proxy_pass http://fineract:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Connection "";
    }
}
